name: Import hover videos (one-off)
on:
  push:
    paths: [".github/hover-trigger"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -fsSL -A "Mozilla/5.0" -o hover.zip "$(cat .github/hover-trigger)"
          mkdir -p tmp_hover assets/hover
          unzip -o -q hover.zip -d tmp_hover || true
          find tmp_hover -type f -iname '*.webm' -exec cp {} assets/hover/ \;
          ls -la assets/hover | head -200
          : > assets/hover/_probe.txt
          for f in assets/hover/*.webm; do
            echo "$(basename "$f") $(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt:stream_tags=alpha_mode:format=duration,size -of compact=p=0:nk=0 "$f" | tr '\n' ' ')" >> assets/hover/_probe.txt
          done
          find tmp_hover -type f | sed 's#^tmp_hover/##' > assets/hover/_all-files.txt
          rm -rf tmp_hover hover.zip
      - run: |
          git config user.name "popsy-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/hover
          git commit -m "Import hover videos from Dropbox"
          git push
