name: Sync from Webflow
# Run manually (Actions tab > Sync from Webflow > Run workflow) after editing CMS items in Webflow.
# Pulls the published popsylovesyou.webflow.io pages, splices the CMS lists into index.html / family.html,
# downloads every image locally into assets/, and commits to main (which redeploys on Vercel).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/mirror.sh
      - run: pip install pillow
      - run: python3 scripts/splice.py _mirror
      # the plain-text guides for AI tools (llms.txt, llms-full.txt) follow the new CMS content
      - run: node scripts/build-llms.js
      - run: |
          rm -rf _mirror
          git config user.name "popsy-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync CMS content from Webflow"
          git push
