  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=689e729c65f81373b9f2b204" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

  <script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js" type="text/javascript"></script>
  <script src="https://cdn.prod.website-files.com/gsap/3.15.0/Flip.min.js" type="text/javascript"></script>

  <script>
	window.detailsEl = {
  	title: document.getElementById('details__title'),
  	image: document.querySelector('.details__thumb img'),
  	desc: document.querySelector('#details__texts [data-text]'),
  	cta: document.querySelector('#details__texts [data-cta]'),

  <script>
	function changeFilter(value) {
  	document.body.dataset.filter = value;
  	document.body.dataset.navOpenMobile = 't';
		window.filteredItems = value ? window.items.filter(p => p.category === value) : window.items;
		window.setTimeout(() => {
      const event = new CustomEvent("globalFilteredItems");
      window.dispatchEvent(event);
    }, 10);
  }
  document.querySelectorAll('#filter-list [data-filter]').forEach(el => {
  	el.addEventListener('click', () => {
    	changeFilter(el.dataset.filter)
    });
  });
  document.getElementById('btn-family').addEventListener('click', () => {
  	document.body.dataset.navOpen = '';
  	document.body.dataset.navOpenMobile = 't';
    changeFilter('');
  });
  document.getElementById('btn-everything').addEventListener('click', () => {
  	document.body.dataset.navOpen = 't';
    document.body.dataset.navOpenMobile = document.body.dataset.navOpenMobile === 't' ? '' : 't';
  });
</script>
  <script type="text/babel">
	function moveFilterSVG() {
  	const defs = document.querySelector('svg.react-flow__edges.react-flow__container defs');
    if (!defs) return;
  	const chalkFilterEl = document.getElementById('chalk-filter');
    if (!chalkFilterEl) return;
    defs.appendChild(chalkFilterEl);
  }
  const { useState, useEffect, useMemo, useCallback, useRef } = React;
  function ReactFlowDiagram() {
    const {
      ReactFlowProvider,
      useNodesState,
      useEdgesState,
      Controls,
      Background,
      ReactFlow,
      MarkerType,
      Handle,
      Position,
      MiniMap,
      useReactFlow,
    } = window.ReactFlow;
    const elk = new ELK();
    const elkLayoutOptions = {
      'elk.algorithm': 'mrtree', /* 'layered', */
      'elk.direction': 'DOWN',
      'elk.layered.spacing.nodeNodeBetweenLayers': '120',
      'elk.spacing.nodeNode': '160',
    };
    const CustomNode = React.memo(({ data }) => {
      return (
      <>
        <Handle type="target" position={Position.Top} isConnectable={false} />
        <div className="w-40 text-center">
          <div> { /* <div className="p-3"> */ }
            { data.image && (
                <img
                  src={data.image}
                  alt={data.name}
                  className="w-25 h-25 object-cover mx-auto"
                  onError={(e) => {
                    e.target.onerror = null; 
                    e.target.src = `https://placehold.co/100x100/cccccc/FFFFFF?text=Error`;
                  }}
                />
            ) }
            <p className="text-sm font-bold text-stone-800">{data.name}</p>
          </div>
        </div>
        <Handle type="source" position={Position.Bottom} isConnectable={false} />
        </>
      );
    });
    const DiagramApp = () => {
      const [nodes, setNodes, onNodesChange] = useNodesState([]);
      const [edges, setEdges, onEdgesChange] = useEdgesState([]);
      const [isLayouting, setIsLayouting] = useState(true);
      const [filteredItems, setFilteredItems] = useState([]);
	  	const { zoomTo, setCenter, getViewport } = useReactFlow();
      useEffect(() => {
        const handleFilteredItems = () => {
          setFilteredItems(window.filteredItems);
        };
        window.addEventListener('globalFilteredItems', handleFilteredItems);
      }, []);
      useEffect(() => {
      	window.setTimeout(() => {
          moveFilterSVG();
        }, 750);
      }, [isLayouting])
      const nodeTypes = useMemo(() => ({ custom: CustomNode }), []);
      const onNodeClick = useCallback((event, node) => {
          // console.log(`Clicked item ID: ${node.id} --- Line 70`);
          const selectedItem = window.items.find(el => el.id === node.id)
          window.detailsEl.title.innerHTML = selectedItem.name;
          window.detailsEl.desc.innerHTML = selectedItem.description;
          window.detailsEl.image.src = selectedItem.image;
          window.detailsEl.cta.href = `mailto:brandon@socialgoodclub.com?subject=${selectedItem.id}%20inquiry`;
          document.body.classList.add('--is-details-showing');
      }, []);
      useEffect(() => {
        const items = window.filteredItems || [];
        if (!items.length) {
          console.warn("window.items is not defined or is empty.");
          setIsLayouting(false);
          return;
        }
        const elkNodes = [];
        const elkEdges = [];
        for (const item of items) {
          elkNodes.push({
            id: item.id,
            width: 160, // w-40
            height: 170, // approximate height of custom node
          });
          if (item.parent && items.find(i => i.id === item.parent)) {
          /* if (item.parent) { */
            elkEdges.push({
              id: `e-${item.parent}-${item.id}`,
              sources: [item.parent],
              targets: [item.id],
            });
          }
        }
        const graph = {
          id: 'root',
          layoutOptions: elkLayoutOptions,
          children: elkNodes,
          edges: elkEdges,
        };
        elk.layout(graph)
          .then((layoutedGraph) => {
              const reactFlowNodes = layoutedGraph.children.map((node) => ({
                  id: node.id,
                  type: 'custom',
                  position: { x: node.x, y: node.y },
                  data: window.filteredItems.find(item => item.id === node.id),
              }));
              const reactFlowEdges = items
                  .filter(item => {
                    const t = item.parent && items.find(i => i.id === item.parent);
                    return t;
                  })
                  .map(item => ({
                      id: `e-${item.parent}-${item.id}`,
                      source: item.parent,
                      target: item.id,
                      label: item.label,
                      /* markerEnd: { type: MarkerType.ArrowClosed, color: '#AAA' }, */
                      style: { stroke: '#000', strokeWidth: 5, filter: 'url(#chalk-filter)', willChange: 'filter' },
                  }));
              setNodes(reactFlowNodes);
              setEdges(reactFlowEdges);
              setIsLayouting(false);
              document.body.dataset.loaded = 't';
              window.setTimeout(() => {
                const rootNodes = layoutedGraph.children.filter(node => {
                  const originalItem = window.items.find(item => item.id === node.id);
                  return originalItem && !originalItem.parent;
                });
                if (rootNodes.length > 0) {
                	/*
                	const minX = Math.min(...rootNodes.map(n => n.x));
                	const maxX = Math.max(...rootNodes.map(n => n.x + n.width));
                	const minY = Math.min(...rootNodes.map(n => n.y));
                	const centerX = minX + (maxX - minX) / 2;
                	const topY = minY + (170 / 2); // 170 is node height
                	setCenter(centerX, topY, { zoom: 1.25, duration: 800 });
                  */
                  const highestNode = rootNodes.reduce((prev, current) => (prev.y < current.y ? prev : current));
                  const centerX = highestNode.x + (highestNode.width / 2);
                  const centerY = highestNode.y + (highestNode.height / 2) + (window.innerHeight / 4);
                  const zoomP = window.innerWidth < 600 ? 1 : 1.15;
                	setCenter(centerX, centerY, { zoom: zoomP, duration: 1500 });
                }                      
                //  zoomTo, setCenter, getViewport
              }, 700);
          })
          .catch(console.error);
      }, [filteredItems, setCenter]);
      if (isLayouting) {
            return (
              <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', fontFamily: 'sans-serif', color: '#888', backgroundColor: '#fafafa' }}>
                  Initializing...
              </div>
          );
      }
      return (
        <div style={{ width: '100%', height: '100%', position: 'relative' }}>
            <ReactFlow
                nodes={nodes}
                edges={edges}
                onNodesChange={onNodesChange}
                onEdgesChange={onEdgesChange}
                nodeTypes={nodeTypes}
                attributionPosition="bottom-left"
                nodesDraggable={false}
                onNodeClick={onNodeClick}
                fitView
                fitViewOptions={{ minZoom: 0.1 }}
                minZoom={0.1}
            >
                {window.innerWidth > 600 && <MiniMap zoomable pannable nodeStrokeWidth={3} />}
                <Controls showInteractive={false} />
                { /* <Background color="#CCCCCC" gap={16} /> */ }
            </ReactFlow>
        </div>
      );
    };
    return (
      <ReactFlowProvider>
        <DiagramApp />
      </ReactFlowProvider>
    );
  }
  function App() {
      const [isReady, setIsReady] = useState(!!window.ReactFlow && !!window.ELK);
      useEffect(() => {
          if (isReady) return;
          const intervalId = setInterval(() => {
              if (window.ReactFlow && window.ELK) {
                  setIsReady(true);
                  clearInterval(intervalId);
              }
          }, 100); 
          return () => clearInterval(intervalId);
      }, [isReady]);
      if (!isReady) {
          return (
              <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', fontFamily: 'sans-serif', color: '#888', backgroundColor: '#fafafa' }}>
                  Initializing...
              </div>
          );
      }
      return <ReactFlowDiagram />;
  }
  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
</script>
