      filterListEl.querySelectorAll('[data-filter]').forEach(el => {

          window.setTimeout(() => {

    function initGrid() {

    	const arrSize = columns * itemsPerColumn;

      const productsArray = [];

  <div class="embed-script w-embed w-script">
    <script type="module">
  gsap.registerPlugin(Draggable, Flip, SplitText)
  class Grid {
    constructor() {
      this.dom = document.querySelector(".container")
      this.grid = document.querySelector(".grid")
      this.products = [...document.querySelectorAll(".product div")]
      this.details = document.querySelector(".details")
      this.detailsThumb = this.details.querySelector(".details__thumb")
      this.fixedEls = document.querySelectorAll('.frame, .nav, .about-link');
      this.fixedEls2 = document.querySelectorAll('.nav-btn');
      this.cross = document.querySelector(".cross")
      this.isDragging = false
    }
    init() {
      this.intro()
    }
    intro() {
      this.centerGrid()
      const headerEl = document.querySelectorAll('.frame, .nav-btn');
      gsap.to(headerEl, {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
      })
      const timeline = gsap.timeline()
      timeline.set(this.dom, { scale: .5 })
      timeline.set(this.products, {
        // scale: 0.5,
        opacity: 0,
      })
      timeline.to(this.products, {
        // scale: 1,
        opacity: 1,
        duration: 0.4,
        ease: "power3.out",
        stagger: {
          amount: 0.8,
          from: "random"
        }
      })
      timeline.to(this.dom, {
        scale: 1,
        duration: 1.2,
        ease: "power3.inOut",
        onComplete: () => {
          this.setupDraggable()
          this.addEvents()
          this.observeProducts()
          this.handleDetails()
          document.body.dataset.started = 'true';
        }
      })
    }
    centerGrid() {
      const gridWidth = this.grid.offsetWidth
      const gridHeight = this.grid.offsetHeight
      const windowWidth = window.innerWidth
      const windowHeight = window.innerHeight
      const centerX = (windowWidth - gridWidth) / 2
      const centerY = (windowHeight - gridHeight) / 2
      gsap.set(this.grid, {
        x: centerX,
        y: centerY
      })
    }
    setupDraggable() {
      this.dom.classList.add("--is-loaded")
      this.draggable = Draggable.create(this.grid, {
        type: "x,y",
        bounds: {
          minX: -(this.grid.offsetWidth - window.innerWidth) - 200,
          maxX: 200,
          minY: -(this.grid.offsetHeight - window.innerHeight) - 100,
          maxY: 100
        },
        inertia: true,
        allowEventDefault: true,
        edgeResistance: 0.9,
        onDragStart: () => {
          this.isDragging = true
          // this.grid.classList.add("--is-dragging")
        },
        onDragEnd: () => {
          this.isDragging = false
          // this.grid.classList.remove("--is-dragging")
        }
      })[0]
    }
    addEvents() {
      /* window.addEventListener("wheel", (e) => { */
      document.getElementById('container').addEventListener("wheel", (e) => {
        e.preventDefault()
        const deltaX = -e.deltaX * 7
        const deltaY = -e.deltaY * 7
        const currentX = gsap.getProperty(this.grid, "x")
        const currentY = gsap.getProperty(this.grid, "y")
        const newX = currentX + deltaX
        const newY = currentY + deltaY
        const bounds = this.draggable.vars.bounds
        const clampedX = Math.max(bounds.minX, Math.min(bounds.maxX, newX))
        const clampedY = Math.max(bounds.minY, Math.min(bounds.maxY, newY))
        gsap.to(this.grid, {
          x: clampedX,
          y: clampedY,
          duration: 0.3,
          ease: "power3.out"
        })
      }, { passive: false })
      window.addEventListener("resize", () => {
        this.updateBounds()
      })
      if (window.innerWidth > 1100) {
        window.addEventListener("mousemove", (e) => {
          if (this.SHOW_DETAILS) {
            this.handleCursor(e)
          }
        })
      }
    }
    updateBounds() {
      if (this.draggable) {
        this.draggable.vars.bounds = {
          minX: -(this.grid.offsetWidth - window.innerWidth) - 50,
          maxX: 50,
          minY: -(this.grid.offsetHeight - window.innerHeight) - 50,
          maxY: 50
        }
      }
    }
    observeProducts() {
      if (window.innerWidth < 1100) return; 
      document.querySelectorAll('.product').forEach(product => {
        const video = product.querySelector('[data-hover-video]');
        product.addEventListener('mouseenter', () => {
          if (video) video.play();
          product.dataset.hover = 'true';
        });
        product.addEventListener('mouseleave', () => {
          window.setTimeout(() => {
            product.dataset.hover = 'false';
            if (video) video.pause();
          	if (video) video.currentTime = 0;
          }, 500);
        });
      });
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.target === this.currentProduct) return
          if (entry.isIntersecting) {
            gsap.to(entry.target, {
              // scale: 1,
              opacity: 1,
              duration: 0.25,
              ease: "power2.out"
            })
          } else {
            gsap.to(entry.target, {
              opacity: 0,
              // scale: 0.5,
              duration: 0.25,
              ease: "power2.in"
            })
          }
        })
      }, {
        root: null,
        threshold: 0.1
      })
      this.products.forEach(product => {
        observer.observe(product)
      })
    }
    handleDetails() {
      this.SHOW_DETAILS = false
      this.title = this.details.querySelector(".details__title")
      this.text = this.details.querySelector(".details__body [data-text]")
      this.desc = this.details.querySelector(".details__body [data-desc]")
      this.cta = this.details.querySelector(".details__body [data-cta]")
      this.products.forEach(product => {
        product.addEventListener("click", (e) => {
          e.stopPropagation()
          this.showDetails(product)
        })
      })
			if (!document.body.dataset.started) {
        this.dom.addEventListener("click", (e) => {
          if (this.SHOW_DETAILS) this.hideDetails()
        })
      }
    }
    showDetails(product) {
	  document.body.dataset.navOpen = '';
      if (this.SHOW_DETAILS) return
      this.SHOW_DETAILS = true
      this.details.classList.add("--is-showing")
      this.dom.classList.add("--is-details-showing")
      const item = window.items.find(item => item.id == product.dataset.id);
      gsap.to(this.dom, {
        // x: window.innerWidth < 600 ? "-90vw" : "-33vw",
        x: window.innerWidth < 600 ? "-90vw" : `-${cssVars.detailsWidth}`,
        duration: 1.2,
        ease: "power3.inOut",
      })
      gsap.to(this.fixedEls, {
        // x: window.innerWidth < 600 ? "-90vw" : "-33vw",
        x: window.innerWidth < 600 ? "-90vw" : `-${cssVars.detailsWidth}`,
        duration: 1.2,
        ease: "power3.inOut",
      })
      gsap.to(this.fixedEls2, {
        // x: window.innerWidth < 600 ? "-90vw" : "-33vw",
        x: window.innerWidth < 600 ? "-90vw" : `-${cssVars.detailsWidth}`,
        // marginLeft: window.innerWidth < 600 ? "-90vw" : "-33vw",
        duration: 1.2,
        ease: "power3.inOut",
      })
      gsap.to(this.details, {
        x: 0,
        duration: 1.2,
        ease: "power3.inOut",
      })
      this.flipProduct(product)
      this.title.innerHTML = item.name;
      this.text.innerHTML = item.text;
      this.cta.href = item.href;
      gsap.to([this.title, this.text, this.cta], {
        autoAlpha: 1,
        duration: 1.1,
        delay: .4,
        ease: "power3.inOut",
        stagger: .05,
      });
    }
    hideDetails() {
      this.SHOW_DETAILS = false
      this.dom.classList.remove("--is-details-showing")
      gsap.to(this.dom, {
        x: 0,
        duration: 1.2,
        delay: .3,
        ease: "power3.inOut",
        onComplete: () => {
          this.details.classList.remove("--is-showing")
        }
      })
      gsap.to(this.fixedEls, {
        x: 0,
        duration: 1.2,
        delay: .3,
        ease: "power3.inOut"
      })
      gsap.to(this.fixedEls2, {
        x: window.innerWidth < 600 ? 0 : "-50%",
        // marginLeft: 0,
        duration: 1.2,
        delay: .3,
        ease: "power3.inOut"
      })
      gsap.to(this.details, {
        // x: window.innerWidth < 600 ? "90vw" : "33vw",
        x: window.innerWidth < 600 ? "90vw" : cssVars.detailsWidth,
        duration: 1.2,
        delay: .3,
        ease: "power3.inOut"
      })
      this.unFlipProduct()
      gsap.to([this.title, this.text, this.cta], {
        autoAlpha: 0,
        duration: 0.6,
        ease: "power3.inOut",
        stagger: 0.05,
      })
    }
    flipProduct(product) {
      this.currentProduct = product
      this.originalParent = product.parentNode
      if (this.observer) {
        this.observer.unobserve(product)
      }
      const state = Flip.getState(product)
      this.detailsThumb.appendChild(product)
      Flip.from(state, {
        absolute: true,
        duration: 1.2,
        ease: "power3.inOut",
      })
      gsap.to(this.cross, {
        scale: 1,
        duration: 0.4,
        delay: .5,
        ease: "power2.out"
      })
      this.detailsThumb.addEventListener('mouseenter', () => {
        const video = this.detailsThumb.querySelector('video');
        if (video) video.play();
      });
    }
    unFlipProduct() {
      if (!this.currentProduct || !this.originalParent) return
      gsap.to(this.cross, {
        scale: 0,
        duration: 0.4,
        ease: "power2.out"
      })
      const state = Flip.getState(this.currentProduct)
      const finalRect = this.originalParent.getBoundingClientRect()
      const currentRect = this.currentProduct.getBoundingClientRect()
      gsap.set(this.currentProduct, {
        position: "absolute",
        top: currentRect.top - this.detailsThumb.getBoundingClientRect().top + "px",
        left: currentRect.left - this.detailsThumb.getBoundingClientRect().left + "px",
        width: currentRect.width + "px",
        height: currentRect.height + "px",
        zIndex: 10000,
      })
      gsap.to(this.currentProduct, {
        top: finalRect.top - this.detailsThumb.getBoundingClientRect().top + "px",
        left: finalRect.left - this.detailsThumb.getBoundingClientRect().left + "px",
        width: finalRect.width + "px",
        height: finalRect.height + "px",
        duration: 1.2,
        delay: .3,
        ease: "power3.inOut",
        onComplete: () => {
          this.originalParent.appendChild(this.currentProduct)
          gsap.set(this.currentProduct, {
            position: "",
            top: "",
            left: "",
            width: "",
            height: "",
            zIndex: "",
          })
          this.currentProduct = null
          this.originalParent = null
        },
      })
    }
    handleCursor(e) {    
      const x = e.clientX
      const y = e.clientY
      gsap.to(this.cross, {
        x: x - this.cross.offsetWidth / 2,
        y: y - this.cross.offsetHeight / 2,
        duration: 0.4,
        ease: "power2.out"
      })
    }
  }
  const grid = new Grid();
  imagesLoaded('.grid img', () => {
    grid.init();
    document.body.classList.remove('loading');
    /* window.setTimeout(() => {
	    if (window.innerWidth > 991) document.body.dataset.navOpen = 't';
    }, 1000); */
  });
  window.filterTrigger = () => {
  	grid.grid.style.transition = 'none';
    grid.centerGrid();
    grid.products = [...document.querySelectorAll(".product div")]
    gsap.set(grid.products, {
      // scale: 0.5,
      opacity: 0,
    })
    grid.details = document.querySelector(".details")
    grid.detailsThumb = grid.details.querySelector(".details__thumb")
    grid.handleDetails();
    imagesLoaded('.grid img', () => {
  		grid.grid.style.transition = '';
      gsap.to(grid.products, {
        // scale: 1,
        opacity: 1,
        duration: 0.4,
        ease: "power3.out",
        stagger: {
          amount: 0.2,
          from: "random"
        }
      })
      window.setTimeout(() => {
        grid.observeProducts();
      }, 900);
    });
  }
</script>
